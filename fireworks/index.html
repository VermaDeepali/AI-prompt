<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Fireworks Show</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at bottom, #0d1b2a, #000814 70%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .controls {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff0080, #7928ca);
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .info {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="controls">
    <button id="showBtn">🎆 Start Automatic Show</button>
  </div>

  <div class="info">
    Click anywhere on the screen to launch fireworks
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const fireworks = [];
    const particles = [];
    const stars = [];

    // =========================
    // Create Stars
    // =========================
    function createStars() {
      stars.length = 0;

      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02
        });
      }
    }

    // =========================
    // Firework Rocket
    // =========================
    class Firework {
      constructor(targetX, targetY) {
        this.x = width / 2 + (Math.random() - 0.5) * 300;
        this.y = height;

        this.targetX = targetX;
        this.targetY = targetY;

        const angle = Math.atan2(targetY - this.y, targetX - this.x);

        this.vx = Math.cos(angle) * 8;
        this.vy = Math.sin(angle) * 8;

        this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;

        this.trail = [];
      }

      update(index) {
        this.trail.push({ x: this.x, y: this.y });

        if (this.trail.length > 10) {
          this.trail.shift();
        }

        this.x += this.vx;
        this.y += this.vy;

        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;

        if (Math.sqrt(dx * dx + dy * dy) < 12) {
          this.explode();
          fireworks.splice(index, 1);
        }
      }

      explode() {
        const count = 80 + Math.random() * 40;

        for (let i = 0; i < count; i++) {
          particles.push(new Particle(
            this.x,
            this.y,
            this.color
          ));
        }
      }

      draw() {
        ctx.beginPath();

        for (let i = 0; i < this.trail.length; i++) {
          const p = this.trail[i];
          ctx.lineTo(p.x, p.y);
        }

        ctx.strokeStyle = this.color;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }

    // =========================
    // Explosion Particles
    // =========================
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.gravity = 0.08;
        this.friction = 0.98;

        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;

        this.size = Math.random() * 3 + 1;

        this.color = color;
      }

      update(index) {
        this.vx *= this.friction;
        this.vy *= this.friction;

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.alpha -= this.decay;

        if (this.alpha <= 0) {
          particles.splice(index, 1);
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;

        ctx.fill();

        ctx.restore();
      }
    }

    // =========================
    // Draw Stars
    // =========================
    function drawStars() {
      stars.forEach(star => {
        star.alpha += (Math.random() - 0.5) * star.speed;

        if (star.alpha < 0.1) star.alpha = 0.1;
        if (star.alpha > 1) star.alpha = 1;

        ctx.save();

        ctx.globalAlpha = star.alpha;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);

        ctx.fillStyle = "white";
        ctx.fill();

        ctx.restore();
      });
    }

    // =========================
    // Animation Loop
    // =========================
    function animate() {
      requestAnimationFrame(animate);

      ctx.fillStyle = "rgba(0, 0, 20, 0.2)";
      ctx.fillRect(0, 0, width, height);

      drawStars();

      fireworks.forEach((firework, index) => {
        firework.update(index);
        firework.draw();
      });

      particles.forEach((particle, index) => {
        particle.update(index);
        particle.draw();
      });
    }

    animate();

    // =========================
    // Launch Firework on Click
    // =========================
    window.addEventListener("click", (e) => {
      // Prevent button click from launching background fireworks
      if (e.target.tagName === "BUTTON") return;

      fireworks.push(new Firework(e.clientX, e.clientY));
    });

    // =========================
    // Automatic Firework Show
    // =========================
    let autoShow = false;
    let interval;

    const showBtn = document.getElementById("showBtn");

    showBtn.addEventListener("click", () => {
      autoShow = !autoShow;

      if (autoShow) {
        showBtn.textContent = "🛑 Stop Automatic Show";

        interval = setInterval(() => {
          const x = Math.random() * width * 0.9 + width * 0.05;
          const y = Math.random() * height * 0.5 + 50;

          fireworks.push(new Firework(x, y));
        }, 350);

      } else {
        showBtn.textContent = "🎆 Start Automatic Show";
        clearInterval(interval);
      }
    });

    // =========================
    // Resize
    // =========================
    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      createStars();
    });

    createStars();
  </script>

</body>
</html>
